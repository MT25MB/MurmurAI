[package]
name = "murmur-ai"
version = "1.2.1"
description = "Murmur AI - 100% local voice-controlled desktop agent"
authors = ["Murmur AI contributors"]
license = "MIT"
repository = "https://github.com/MT25MB/MurmurAI"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "murmurai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
