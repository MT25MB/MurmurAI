version: 2
updates:
  # ------------------------------------------------------------------
  # Rust / Tauri shell
  # ------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"

    ignore:
      # RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g — unsoundness in
      # glib::VariantStrIter (Linux-only, used by Tauri's GTK stack).
      # Fixed in glib >= 0.20.0, but Tauri 2.x pins gtk 0.18 -> glib ^0.18,
      # so no compatible upgrade exists yet. Ignore this one transitive
      # advisory until Tauri moves to a gtk release that allows glib 0.20+.
      # Remove this ignore rule once Tauri upgrades its gtk dependency.
      - dependency-name: "glib"
        versions: [">=0.15.0, <0.20.0"]

  # ------------------------------------------------------------------
  # Frontend + website npm workspaces
  # ------------------------------------------------------------------
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/website"
    schedule:
      interval: "weekly"

  # ------------------------------------------------------------------
  # Python backend + GitHub Actions
  # ------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
