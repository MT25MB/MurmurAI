[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Murmur AI-backend"
version = "0.1.0"
description = "Murmur AI local voice sidecar — FastAPI + WebSocket control plane"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "websockets>=14",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.5",
  "faster-whisper>=1.1",
  "webrtcvad-wheels>=2.0.14",
  "kokoro>=0.1.0",
  "pyttsx3>=2.90",
]
computer = [
  "pyautogui>=0.9.54",
  "mss>=10.0",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["audio*", "agent*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
