[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murmur-ai-backend"
version = "1.2.81"
description = "Murmur AI local voice sidecar: FastAPI + WebSocket control plane"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "websockets>=14",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "pypdf>=4.0",
  "python-docx>=1.0",
  # Optional at runtime: when no OS credential store is reachable, the
  # encrypted local fallback is used instead.
  "keyring>=24.0",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.5",
  "faster-whisper>=1.1",
  "webrtcvad-wheels>=2.0.14",
  "kokoro>=0.1.0",
  "pyttsx3>=2.90",
]
computer = [
  "pyautogui>=0.9.54",
  "mss>=10.0",
  "playwright>=1.44",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["audio*", "agent*", "tools*", "system*", "security*", "remote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
# Third-party deprecation from starlette.testclient's httpx shim; the app does
# not use that code path in production and the warning adds no signal.
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
