<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080A0F">
  <meta name="referrer" content="no-referrer">
  <title>Murmur AI Phone Remote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Murmur AI</h1>
    <p id="status" role="status" aria-live="polite">Connecting…</p>
  </header>

  <main>
    <section id="pair-section" aria-labelledby="pair-heading">
      <h2 id="pair-heading">Pair this phone</h2>
      <p>Enter the six-digit code Murmur spoke aloud. It changes every few minutes.</p>
      <form id="pair-form">
        <label for="pin">Pairing code</label>
        <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{6}"
               maxlength="6" autocomplete="one-time-code" autocapitalize="off"
               spellcheck="false" aria-describedby="pin-help" required>
        <p id="pin-help">Six digits. Say “start phone remote” to hear a fresh code.</p>
        <button type="submit" id="pair-button">Pair this phone</button>
      </form>
    </section>

    <section id="controls" aria-labelledby="controls-heading" hidden>
      <h2 id="controls-heading">Controls</h2>

      <button id="talk" type="button" aria-label="Hold to talk to Murmur">
        Hold to talk
      </button>

      <form id="command-form">
        <label for="command">Or type a command</label>
        <input id="command" name="command" type="text" autocomplete="off"
               placeholder="What should Murmur do?" enterkeyhint="send">
        <button type="submit" id="send-button">Send command</button>
      </form>

      <button id="describe" type="button" aria-label="Describe the desktop screen">
        Describe desktop screen
      </button>

      <button id="stop" type="button" class="danger" aria-label="Interrupt and stop current action">
        Interrupt / Stop
      </button>
    </section>

    <section id="approval-section" aria-labelledby="approval-heading" hidden>
      <h2 id="approval-heading">Approval needed</h2>
      <p id="approval-description"></p>
      <p id="approval-command" class="mono"></p>
      <div class="approval-actions">
        <button id="approve" type="button" aria-label="Approve this action">Approve</button>
        <button id="cancel" type="button" class="danger" aria-label="Cancel this action">Cancel</button>
      </div>
    </section>

    <section aria-labelledby="transcript-heading">
      <h2 id="transcript-heading">Conversation</h2>
      <div id="transcript" role="log" aria-live="polite" aria-relevant="additions text"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
